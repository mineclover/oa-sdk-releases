name: Inspect npm trusted publishing

# Read-only diagnostic: list the trusted publishers currently configured for the release packages.
# The npm-publish environment token may read this even when it cannot create or revoke relationships.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  inspect:
    name: List trusted publishers
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: List trusted publishers
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for package in @oa-sdk/tools @oa-sdk/mcp-mesh; do
            echo "::group::$package"
            npm trust list "$package" --json
            echo "::endgroup::"
          done
